name: UHH Tier One Regression

on:
  push:
    branches:
      - development/uhh-9-5-integrated
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uhh-tier-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regression:
    name: Source regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ingredient knowledge regression
        run: node scripts/run-ingredient-knowledge-regression.cjs

      - name: Ingredient integration acceptance
        run: node scripts/run-r-p2-03-acceptance.cjs

      - name: Lower-sodium regression
        run: node scripts/run-lower-sodium-regression.cjs

      - name: Learning Hub regression
        run: node scripts/run-learning-hub-regression.cjs

      - name: HTML metadata integrity
        run: node scripts/run-site-integrity-regression.cjs metadata

      - name: Local link and asset integrity
        run: node scripts/run-site-integrity-regression.cjs links

      - name: Accessibility source semantics
        id: accessibility
        shell: bash
        run: |
          set +e
          node scripts/run-accessibility-source-regression.cjs > accessibility-source-regression.txt 2>&1
          code=$?
          cat accessibility-source-regression.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-source-regression-${{ github.sha }}
          path: accessibility-source-regression.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce accessibility result
        if: steps.accessibility.outputs.exit_code != '0'
        run: exit 1

      - name: Release-boundary safety regression
        run: node scripts/run-release-boundary-regression.cjs

      - name: Verify 9.5 manifest identity
        shell: bash
        run: |
          grep -q 'UHH-WEBSITE-9.5-DEVELOPMENT-2026-08-30' manifest.webmanifest
          grep -q '"start_url": "./index.html"' manifest.webmanifest

      - name: Boundary reminder
        run: echo 'Source regression green does not equal hosted runtime, device, commerce, or release green.'
