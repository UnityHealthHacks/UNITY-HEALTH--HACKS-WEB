name: UHH Tier One Regression

on:
  push:
    branches:
      - development/uhh-9-5-integrated
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uhh-tier-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regression:
    name: Source regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: CI policy regression
        run: node scripts/run-ci-policy-regression.cjs

      - name: External execution and submission boundaries
        run: node scripts/run-external-execution-boundary-regression.cjs

      - name: Inline execution and navigation boundaries
        run: node scripts/run-inline-execution-boundary-regression.cjs

      - name: Dynamic code execution boundaries
        run: node scripts/run-dynamic-code-execution-boundary-regression.cjs

      - name: First-party network egress boundaries
        run: node scripts/run-first-party-network-egress-regression.cjs

      - name: CSS external resource boundaries
        run: node scripts/run-css-external-resource-boundary-regression.cjs

      - name: Vendored third-party integrity
        run: node scripts/run-vendored-third-party-integrity-regression.cjs

      - name: Sensitive artifact path boundary
        run: node scripts/run-sensitive-artifact-path-regression.cjs

      - name: Ingredient knowledge regression
        run: node scripts/run-ingredient-knowledge-regression.cjs

      - name: Ingredient integration acceptance
        run: node scripts/run-r-p2-03-acceptance.cjs

      - name: Lower-sodium regression
        run: node scripts/run-lower-sodium-regression.cjs

      - name: Learning Hub regression
        run: node scripts/run-learning-hub-regression.cjs

      - name: HTML metadata integrity
        run: node scripts/run-site-integrity-regression.cjs metadata

      - name: Local link and asset integrity
        run: node scripts/run-site-integrity-regression.cjs links

      - name: Accessibility source semantics
        id: accessibility
        shell: bash
        run: |
          set +e
          node scripts/run-accessibility-source-regression.cjs > accessibility-source-regression.txt 2>&1
          code=$?
          cat accessibility-source-regression.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accessibility-source-regression-${{ github.sha }}
          path: accessibility-source-regression.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce accessibility result
        if: steps.accessibility.outputs.exit_code != '0'
        run: exit 1

      - name: Keyboard and navigation source safeguards
        id: keyboard_navigation
        shell: bash
        run: |
          set +e
          node scripts/run-keyboard-navigation-source-regression.cjs > keyboard-navigation-source-regression.txt 2>&1
          code=$?
          cat keyboard-navigation-source-regression.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve keyboard/navigation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keyboard-navigation-source-regression-${{ github.sha }}
          path: keyboard-navigation-source-regression.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce keyboard/navigation result
        if: steps.keyboard_navigation.outputs.exit_code != '0'
        run: exit 1

      - name: Release-boundary safety regression
        run: node scripts/run-release-boundary-regression.cjs

      - name: Local Guardian privacy boundary
        run: node scripts/run-local-privacy-boundary-regression.cjs

      - name: Service worker stale-cache source safeguards
        run: node scripts/run-service-worker-source-regression.cjs

      - name: Verify 9.5 manifest identity
        shell: bash
        run: |
          grep -q 'UHH-WEBSITE-9.5-DEVELOPMENT-2026-08-30' manifest.webmanifest
          grep -q '"start_url": "./index.html"' manifest.webmanifest

      - name: Boundary reminder
        run: echo 'Source regression green does not equal hosted runtime, device, commerce, or release green.'